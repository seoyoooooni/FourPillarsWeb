# 백엔드 이름과 로컬 PostgreSQL 연결 기본값을 설정함.
spring.application.name=FourPillarsBackend

spring.datasource.url=${FOURPILLARS_DB_URL:jdbc:postgresql://127.0.0.1:5432/fourpillars}
spring.datasource.username=${FOURPILLARS_DB_USERNAME:fourpillars_app}
spring.datasource.password=${FOURPILLARS_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

fourpillars.jwt.private-key-base64=${FOURPILLARS_JWT_PRIVATE_KEY_BASE64}
fourpillars.jwt.public-key-base64=${FOURPILLARS_JWT_PUBLIC_KEY_BASE64}
